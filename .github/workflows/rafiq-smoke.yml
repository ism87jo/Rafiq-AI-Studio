name: Rafiq CPU smoke test
on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install CPU dependencies
        shell: pwsh
        run: ./rafiq/setup.ps1
      - name: Verify the engine starts
        shell: pwsh
        run: ./.venv/Scripts/python.exe rafiq/smoke.py
